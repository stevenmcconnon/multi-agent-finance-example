# Local collector: apps send OTLP/http to :4318; traces fan out to Phoenix and the console.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
    tls:
      insecure: true
  # In production: metrics go to CloudWatch as EMF through the ADOT sidecar
  #   (infra/terraform/modules/observability/adot.yaml), traces to X-Ray or Phoenix on Fargate.
  # In this demo: Phoenix + console only, because a laptop has no CloudWatch and the sample is $0.
  # awsemf:
  #   namespace: multi-agent-finance-example
  #   log_group_name: /multi-agent-finance-example/metrics

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/phoenix, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
