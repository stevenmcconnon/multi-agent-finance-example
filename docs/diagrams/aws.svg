<text x="960" y="594" font-size="11" fill="#6b7280" text-anchor="middle">fetch filings</text>
<line x1="440" y1="620" x2="440" y2="660" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="560" y1="610" x2="590" y2="660" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="740" y1="790" x2="740" y2="752" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
<text x="748" y="776" font-size="11" fill="#6b7280">ECS run-task on a schedule</text>
<text x="24" y="892" font-size="11" fill="#6b7280">Sizes and list prices: infra/terraform/COST.md (about $5/day, nothing metered here). Teardown: make tf-destroy. The browser signs in at the Cognito hosted UI with authorization code + PKCE.</text>
