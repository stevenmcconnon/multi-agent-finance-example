<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="1100" height="820" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>multi-agent-finance-example: seven layers, local demo versus cloud mode</title>
<text x="40" y="34" font-size="22" font-weight="600" fill="#6b7280">multi-agent-finance-example — the seven layers</text>
<text x="40" y="54" font-size="13" fill="#6b7280">Each row: the layer, its folder, and what runs it. Only technologies present in the code or the Terraform are named.</text>
<text x="350" y="86" font-size="14" font-weight="600" fill="#6b7280">Local demo (what `make up` runs)</text>
<text x="725" y="86" font-size="14" font-weight="600" fill="#6b7280">Cloud mode (Terraform, not applied)</text>

<!-- L7 -->
<rect x="40" y="100" width="1020" height="92" rx="8" fill="#15803d"/>
<text x="56" y="130" font-size="19" font-weight="700" fill="#ffffff">L7  Experience</text>
<text x="56" y="152" font-size="12" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">apps/web · api/ · mcp_server/</text>
<text x="56" y="176" font-size="12.5" fill="#ffffff">The web app, the API, the MCP server</text>
<rect x="350" y="110" width="360" height="72" rx="6" fill="#f8fafc"/>
<text x="362" y="136" font-size="14" fill="#111827">React (Vite) · FastAPI</text>
<text x="362" y="160" font-size="14" fill="#111827">nginx · MCP server</text>
<rect x="720" y="110" width="330" height="72" rx="6" fill="#f8fafc"/>
<text x="732" y="136" font-size="14" fill="#111827">S3 + CloudFront · ALB</text>
<text x="732" y="160" font-size="14" fill="#111827">ECS Fargate (api)</text>

<!-- L6 -->
<rect x="40" y="200" width="1020" height="92" rx="8" fill="#1d4ed8"/>
<text x="56" y="230" font-size="19" font-weight="700" fill="#ffffff">L6  Orchestration</text>
<text x="56" y="252" font-size="12" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">agent/ · ingest/workflow.py</text>
<text x="56" y="276" font-size="12.5" fill="#ffffff">The turn (seconds), ingestion (hours)</text>
<rect x="350" y="210" width="360" height="72" rx="6" fill="#f8fafc"/>
<text x="362" y="236" font-size="14" fill="#111827">LangGraph (Supervisor graph)</text>
<text x="362" y="260" font-size="14" fill="#111827">Temporal dev server</text>
<rect x="720" y="210" width="330" height="72" rx="6" fill="#f8fafc"/>
<text x="732" y="236" font-size="14" fill="#111827">LangGraph (Supervisor graph)</text>
<text x="732" y="260" font-size="14" fill="#111827">Temporal on ECS Fargate</text>

<!-- L5 -->
<rect x="40" y="300" width="1020" height="92" rx="8" fill="#7c3aed"/>
<text x="56" y="330" font-size="19" font-weight="700" fill="#ffffff">L5  AI Harness</text>
<text x="56" y="352" font-size="12" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">harness/</text>
<text x="56" y="376" font-size="12.5" fill="#ffffff">Identity, tool registry, the one tool door</text>
<rect x="350" y="310" width="360" height="72" rx="6" fill="#f8fafc"/>
<text x="362" y="336" font-size="14" fill="#111827">python-jose (HS256 dev tokens)</text>
<text x="362" y="360" font-size="14" fill="#111827">Tenacity · pybreaker</text>
<rect x="720" y="310" width="330" height="72" rx="6" fill="#f8fafc"/>
<text x="732" y="336" font-size="14" fill="#111827">Cognito (RS256 JWKS)</text>
<text x="732" y="360" font-size="14" fill="#111827">Tenacity · pybreaker</text>

<!-- L4 -->
<rect x="40" y="400" width="1020" height="92" rx="8" fill="#b45309"/>
<text x="56" y="430" font-size="19" font-weight="700" fill="#ffffff">L4  Knowledge / Retrieval</text>
<text x="56" y="452" font-size="12" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">retrieval/ · authz/</text>
<text x="56" y="476" font-size="12.5" fill="#ffffff">The ACL predicate, hybrid search, policy</text>
<rect x="350" y="410" width="360" height="72" rx="6" fill="#f8fafc"/>
<text x="362" y="436" font-size="14" fill="#111827">Postgres: pgvector + tsvector</text>
<text x="362" y="460" font-size="14" fill="#111827">Cedar via cedarpy · Valkey</text>
<rect x="720" y="410" width="330" height="72" rx="6" fill="#f8fafc"/>
<text x="732" y="436" font-size="14" fill="#111827">RDS Postgres (pgvector)</text>
<text x="732" y="460" font-size="14" fill="#111827">Verified Permissions · ElastiCache Valkey</text>

<!-- L3 -->
<rect x="40" y="500" width="1020" height="92" rx="8" fill="#be123c"/>
<text x="56" y="530" font-size="19" font-weight="700" fill="#ffffff">L3  Models</text>
<text x="56" y="552" font-size="12" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">gateway/ · retrieval/{embed,rerank}.py</text>
<text x="56" y="576" font-size="12.5" fill="#ffffff">The only code that talks to a model</text>
<rect x="350" y="510" width="360" height="72" rx="6" fill="#f8fafc"/>
<text x="362" y="536" font-size="14" fill="#111827">Fake gateway (deterministic)</text>
<text x="362" y="560" font-size="14" fill="#111827">fastembed: jina embeddings · BGE reranker</text>
<rect x="720" y="510" width="330" height="72" rx="6" fill="#f8fafc"/>
<text x="732" y="536" font-size="14" fill="#111827">Bedrock: Claude Sonnet 4.5 · Haiku 4.5</text>
<text x="732" y="560" font-size="14" fill="#111827">Titan Embeddings v2 · Cohere Rerank 3.5</text>

<!-- L2 -->
<rect x="40" y="600" width="1020" height="92" rx="8" fill="#0f766e"/>
<text x="56" y="630" font-size="19" font-weight="700" fill="#ffffff">L2  Data / Pipelines</text>
<text x="56" y="652" font-size="12" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ingest/</text>
<text x="56" y="676" font-size="12.5" fill="#ffffff">EDGAR fetch, parse, chunk, embed, write</text>
<rect x="350" y="610" width="360" height="72" rx="6" fill="#f8fafc"/>
<text x="362" y="636" font-size="14" fill="#111827">httpx (EDGAR client) · BeautifulSoup + lxml</text>
<text x="362" y="660" font-size="14" fill="#111827">Temporal worker · data/edgar/ on disk</text>
<rect x="720" y="610" width="330" height="72" rx="6" fill="#f8fafc"/>
<text x="732" y="636" font-size="14" fill="#111827">S3 raw bucket · EventBridge Scheduler</text>
<text x="732" y="660" font-size="14" fill="#111827">ECS Fargate (ingest-worker)</text>

<!-- L1 -->
<rect x="40" y="700" width="1020" height="92" rx="8" fill="#374151"/>
<text x="56" y="730" font-size="19" font-weight="700" fill="#ffffff">L1  Cloud / Platform</text>
<text x="56" y="752" font-size="12" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">infra/ · observability/</text>
<text x="56" y="776" font-size="12.5" fill="#ffffff">Where it runs and how it is watched</text>
<rect x="350" y="710" width="360" height="72" rx="6" fill="#f8fafc"/>
<text x="362" y="736" font-size="14" fill="#111827">Docker Compose · OpenTelemetry collector</text>
<text x="362" y="760" font-size="14" fill="#111827">Phoenix traces · Prometheus /metrics</text>
<rect x="720" y="710" width="330" height="72" rx="6" fill="#f8fafc"/>
<text x="732" y="736" font-size="14" fill="#111827">Terraform · VPC</text>
<text x="732" y="760" font-size="14" fill="#111827">CloudWatch + ADOT · Managed Grafana</text>
