<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 848" width="1100" height="848" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>harness-rag: seven layers</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
<text x="60" y="36" font-size="22" font-weight="600" fill="#6b7280">harness-rag — the seven layers</text>
<text x="60" y="56" font-size="13" fill="#6b7280">A question travels down from L7 to L1; evidence and decisions travel back up. Each box names its folder and its libraries.</text>
<rect x="60" y="70" width="980" height="96" rx="8" fill="#15803d"/>
<text x="78" y="100" font-size="20" font-weight="700" fill="#ffffff">L7</text>
<text x="122" y="100" font-size="19" font-weight="600" fill="#ffffff">Experience</text>
<text x="78" y="122" font-size="12.5" fill="#ffffff" opacity="0.9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">apps/web · services/harness_rag/api · services/harness_rag/mcp_server</text>
<text x="78" y="142" font-size="13" fill="#ffffff" opacity="0.95">React (Vite), React Router, Tailwind, Zod · FastAPI + SSE · MCP server over the same tools</text>
<rect x="60" y="176" width="980" height="96" rx="8" fill="#1d4ed8"/>
<text x="78" y="206" font-size="20" font-weight="700" fill="#ffffff">L6</text>
<text x="122" y="206" font-size="19" font-weight="600" fill="#ffffff">Orchestration</text>
<text x="78" y="228" font-size="12.5" fill="#ffffff" opacity="0.9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">services/harness_rag/agent/graph.py</text>
<text x="78" y="248" font-size="13" fill="#ffffff" opacity="0.95">LangGraph StateGraph: understand → policy → plan → act (hitl interrupt for write / money tools) → generate → verify → answer | abstain</text>
<text x="78" y="265" font-size="13" fill="#ffffff" opacity="0.95">· approve() resumes · Postgres checkpointer, replay</text>
<rect x="60" y="282" width="980" height="96" rx="8" fill="#b91c1c"/>
<text x="78" y="312" font-size="20" font-weight="700" fill="#ffffff">L5</text>
<text x="122" y="312" font-size="19" font-weight="600" fill="#ffffff">AI Harness</text>
<text x="78" y="334" font-size="12.5" fill="#ffffff" opacity="0.9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">services/harness_rag/harness</text>
<text x="78" y="354" font-size="13" fill="#ffffff" opacity="0.95">identity (JWT → Principal, groups from the DB) · ToolRegistry (risk read / write / money) · run_tool: Cedar → risk gate →</text>
<text x="78" y="371" font-size="13" fill="#ffffff" opacity="0.95">idempotency reserve → Tenacity retries → pybreaker → audit · TurnBudget</text>
<rect x="60" y="388" width="980" height="96" rx="8" fill="#b45309"/>
<text x="78" y="418" font-size="20" font-weight="700" fill="#ffffff">L4</text>
<text x="122" y="418" font-size="19" font-weight="600" fill="#ffffff">Knowledge / Retrieval</text>
<text x="78" y="440" font-size="12.5" fill="#ffffff" opacity="0.9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">services/harness_rag/retrieval · services/harness_rag/authz</text>
<text x="78" y="460" font-size="13" fill="#ffffff" opacity="0.95">pgvector HNSW + tsvector, ACL predicate in SQL before RRF fusion, rerank and relevance floor · facts table · Cedar (cedarpy local /</text>
<text x="78" y="477" font-size="13" fill="#ffffff" opacity="0.95">Verified Permissions, fail closed) · Redis group cache</text>
<rect x="60" y="494" width="980" height="96" rx="8" fill="#6d28d9"/>
<text x="78" y="524" font-size="20" font-weight="700" fill="#ffffff">L3</text>
<text x="122" y="524" font-size="19" font-weight="600" fill="#ffffff">Models</text>
<text x="78" y="546" font-size="12.5" fill="#ffffff" opacity="0.9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">services/harness_rag/gateway · retrieval/embed.py · retrieval/rerank.py</text>
<text x="78" y="566" font-size="13" fill="#ffffff" opacity="0.95">Bedrock converse: Claude Sonnet 4.5 generate, Claude Haiku 4.5 verify · Titan v2 512-dim · Cohere Rerank 3.5 · local:</text>
<text x="78" y="583" font-size="13" fill="#ffffff" opacity="0.95">fake gateway, jina-v2-small (fastembed), BGE reranker</text>
<rect x="60" y="600" width="980" height="96" rx="8" fill="#0f766e"/>
<text x="78" y="630" font-size="20" font-weight="700" fill="#ffffff">L2</text>
<text x="122" y="630" font-size="19" font-weight="600" fill="#ffffff">Data / Pipelines</text>
<text x="78" y="652" font-size="12.5" fill="#ffffff" opacity="0.9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">services/harness_rag/ingest</text>
<text x="78" y="672" font-size="13" fill="#ffffff" opacity="0.95">EDGAR → Temporal workflows → parse → XBRL facts → embed → Postgres, one transaction per filing · idempotent jobs ·</text>
<text x="78" y="689" font-size="13" fill="#ffffff" opacity="0.95">dead letter = ingest_jobs.status = 'dead' · no SQS</text>
<rect x="60" y="706" width="980" height="96" rx="8" fill="#334155"/>
<text x="78" y="736" font-size="20" font-weight="700" fill="#ffffff">L1</text>
<text x="122" y="736" font-size="19" font-weight="600" fill="#ffffff">Cloud / Platform</text>
<text x="78" y="758" font-size="12.5" fill="#ffffff" opacity="0.9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">infra/terraform · infra/otel · infra/grafana</text>
<text x="78" y="778" font-size="13" fill="#ffffff" opacity="0.95">Terraform: VPC, ECS Fargate, ALB, RDS Postgres 16, ElastiCache Valkey, Cognito, Verified Permissions, Bedrock, S3 +</text>
<text x="78" y="795" font-size="13" fill="#ffffff" opacity="0.95">CloudFront, EventBridge Scheduler, CloudWatch, ADOT / OTel collector</text>
<line x1="28" y1="70" x2="28" y2="802" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<text transform="translate(14 436) rotate(-90)" font-size="12" text-anchor="middle" fill="#6b7280">question</text>
<line x1="1072" y1="802" x2="1072" y2="70" stroke="#6b7280" stroke-width="2" marker-end="url(#a)"/>
<text transform="translate(1090 436) rotate(90)" font-size="12" text-anchor="middle" fill="#6b7280">evidence · decisions</text>
<text x="60" y="836" font-size="12" fill="#6b7280">Invariant across every layer: an unauthorized chunk never enters a prompt, a reranker, a log, a cache or an eval dataset.</text>
</svg>