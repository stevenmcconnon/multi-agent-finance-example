[project]
name = "multi-agent-finance-example"
version = "0.1.0"
description = "Permission-safe enterprise RAG + AI harness on AWS (LangGraph, pgvector, Cedar, Temporal, Bedrock, MCP, OTel)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=0.3",
  "langchain-aws>=0.2",
  "boto3>=1.35",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "redis>=5.0",
  "tenacity>=9.0",
  "pybreaker>=1.2",
  "httpx>=0.27",
  "mcp>=1.2",
  "temporalio>=1.7",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "fastembed>=0.4",
  "cedarpy>=4.0",
  "python-jose[cryptography]>=3.3",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "openinference-instrumentation-langchain>=0.1.30",
  "prometheus-fastapi-instrumentator>=7.0",
  "structlog>=24.1",
  "typer>=0.12",
]

[project.optional-dependencies]
evals = ["ragas>=0.2", "deepeval>=1.0", "datasets>=2.20"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "testcontainers[postgres]>=4.8", "fakeredis>=2.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/finance_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals/suites"]
pythonpath = ["services"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["finance_agents"]
mypy_path = "services"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
